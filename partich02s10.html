    <p>Partikkelit ovat taipumattomia, joten niiden paino ei muutu.</p>

    <ul class="itemizedlist">
      <li>
        <p>Funktiosanat θα, να</p>
      </li>

      <li>
        <p>kielto ja myöntö ναι, όχι, δεν, μην</p>
      </li>

      <li>
        <p>konjunktiot</p>
      </li>

      <li>
        <p>interjektiot.</p>
      </li>
    </ul>
